<!DOCTYPE html>
<html lang="pl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Michael Fries</title>
<meta name="description" content="Michael Fries – software engineer. Boty Discord, aplikacje C++ i wszystko o komputerach.">
<meta name="theme-color" content="#0d1017">
<meta property="og:title" content="Michael Fries">
<meta property="og:description" content="Software engineer. Discord bots, C++ apps and anything about computers.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2" defer></script>
<style>
:root{
  --bg:#0d1017;
  --panel:#151a23;
  --panel-2:#1a2130;
  --line:#242c3b;
  --text:#e8ebf2;
  --muted:#8c95a8;
  --accent:#8b9bff;
  --accent-2:#5eead4;
}
*{margin:0;padding:0;box-sizing:border-box;}
::selection{background:var(--accent);color:#0d1017;}
body{
  min-height:100vh;
  background:
    radial-gradient(600px 300px at 50% -80px,rgba(139,155,255,.16),transparent 70%),
    var(--bg);
  color:var(--muted);
  font-family:'Inter',system-ui,sans-serif;
  display:flex;
  flex-direction:column;
  align-items:center;
  gap:16px;
  padding:48px 16px;
}
.window{
  width:440px;max-width:100%;
  background:var(--panel);
  border:1px solid var(--line);
  border-radius:14px;
  box-shadow:0 20px 50px rgba(0,0,0,.35);
  overflow:hidden;
}
.titlebar{
  display:flex;align-items:center;gap:7px;
  padding:11px 14px;
  background:var(--panel-2);
  border-bottom:1px solid var(--line);
  font-family:'JetBrains Mono',monospace;
  font-size:11.5px;color:var(--muted);
}
.titlebar i{width:10px;height:10px;border-radius:50%;background:#2f394d;}
.titlebar span{margin-left:6px;}
.titlebar .views{margin-left:auto;display:flex;align-items:center;gap:6px;}
.titlebar .views::before{content:"";width:6px;height:6px;border-radius:50%;background:var(--accent-2);}

.profile{padding:30px 28px 26px;text-align:center;}
.avatar{
  width:92px;height:92px;margin:0 auto 16px;border-radius:50%;overflow:hidden;
  border:2px solid var(--line);
  box-shadow:0 0 0 4px rgba(139,155,255,.14);
  background:var(--panel-2);
  display:flex;align-items:center;justify-content:center;
  font-size:30px;font-weight:700;color:var(--accent);
}
.avatar img{width:100%;height:100%;object-fit:cover;}
h1{font-size:24px;font-weight:700;color:var(--text);letter-spacing:-.3px;}
.role{margin-top:4px;font-size:13.5px;color:var(--accent);font-weight:500;}
.bio{margin:14px auto 0;max-width:340px;font-size:14px;line-height:1.6;}
.tags{margin-top:16px;display:flex;justify-content:center;flex-wrap:wrap;gap:8px;}
.tag{
  font-family:'JetBrains Mono',monospace;font-size:11.5px;
  padding:4px 11px;border-radius:7px;
  background:var(--panel-2);border:1px solid var(--line);color:var(--text);
}
.socials{margin-top:22px;display:flex;justify-content:center;gap:10px;}
.social{
  position:relative;width:40px;height:40px;border-radius:10px;
  border:1px solid var(--line);background:var(--panel-2);color:var(--muted);
  display:flex;align-items:center;justify-content:center;
  text-decoration:none;cursor:pointer;
  transition:color .15s,border-color .15s,background .15s;
}
.social svg{width:17px;height:17px;fill:currentColor;}
.social:hover{color:var(--text);border-color:var(--accent);background:#1f2740;}
.tip{
  position:absolute;bottom:calc(100% + 8px);left:50%;transform:translateX(-50%);
  white-space:nowrap;font-size:11px;padding:4px 9px;border-radius:6px;
  background:var(--text);color:var(--bg);opacity:0;pointer-events:none;transition:opacity .15s;
}
.tip.show{opacity:1;}

.projects{padding:8px;display:grid;gap:4px;}
.project{
  display:flex;align-items:center;gap:14px;
  padding:12px;border-radius:9px;
  text-decoration:none;
  transition:background .15s;
}
.project:hover,.project:focus-visible{background:var(--panel-2);}
.project .icon{
  flex:none;width:38px;height:38px;border-radius:9px;
  background:rgba(139,155,255,.12);color:var(--accent);
  display:flex;align-items:center;justify-content:center;
}
.project .icon svg{width:18px;height:18px;fill:none;stroke:currentColor;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round;}
.project .info{flex:1;min-width:0;}
.project .name{display:block;font-size:14px;font-weight:600;color:var(--text);}
.project .desc{display:block;margin-top:2px;font-size:12.5px;line-height:1.45;}
.project .arrow{flex:none;color:var(--muted);transition:transform .15s,color .15s;}
.project .arrow svg{width:16px;height:16px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;}
.project:hover .arrow{color:var(--accent);transform:translateX(3px);}

footer{font-family:'JetBrains Mono',monospace;font-size:11.5px;margin-top:4px;}

a:focus-visible,button:focus-visible{outline:2px solid var(--accent);outline-offset:2px;}
@media (prefers-reduced-motion:reduce){*{transition:none !important;}}
</style>
</head>
<body>

<main class="window" aria-label="Profil">
  <div class="titlebar">
    <i></i><i></i><i></i><span>michael.fries</span>
    <div class="views" title="Liczba wyświetleń"><span id="view-count">···</span></div>
  </div>
  <div class="profile">
    <div class="avatar"><img src="https://i.pinimg.com/564x/37/17/d6/3717d6a414d8dc80186aa48cbd089804.jpg" alt="Avatar Michaela Friesa" onerror="this.replaceWith('MF')"></div>
    <h1>Michael Fries</h1>
    <div class="role">Software engineer</div>
    <p class="bio">Discord bots, C++ apps and anything about computers.</p>
    <div class="tags">
      <span class="tag">Python</span>
      <span class="tag">C++</span>
      <span class="tag">JavaScript</span>
    </div>
    <div class="socials">
      <button class="social" id="discord-btn" type="button" aria-label="Discord – kopiuj nazwę użytkownika" data-user="TWOJ_NICK_DISCORD">
        <span class="tip" id="discord-tip" role="status"></span>
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M20.3 4.4A19.8 19.8 0 0 0 15.6 3l-.3.6a14.2 14.2 0 0 1 4 1.6 15.3 15.3 0 0 0-13.6 0A14.2 14.2 0 0 1 9.7 3l-.3-.6a19.8 19.8 0 0 0-4.7 1.5C1.7 8.5 1 12.5 1.3 16.4a19.9 19.9 0 0 0 6 3l1-1.6a13 13 0 0 1-1.9-.9l.5-.4a14.3 14.3 0 0 0 12.2 0l.5.4a13 13 0 0 1-1.9.9l1 1.6a19.9 19.9 0 0 0 6-3c.4-4.5-.7-8.5-3-12ZM8.9 14.3c-.9 0-1.6-.8-1.6-1.8s.7-1.8 1.6-1.8 1.6.8 1.6 1.8-.7 1.8-1.6 1.8Zm6.2 0c-.9 0-1.6-.8-1.6-1.8s.7-1.8 1.6-1.8 1.6.8 1.6 1.8-.7 1.8-1.6 1.8Z"/></svg>
      </button>
      <a class="social" href="https://github.com/michaelfriesdev/" target="_blank" rel="noopener noreferrer" aria-label="GitHub">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 2a10 10 0 0 0-3.2 19.5c.5.1.7-.2.7-.5v-1.7c-2.8.6-3.4-1.3-3.4-1.3-.4-1.2-1-1.5-1-1.5-.9-.6.1-.6.1-.6 1 .1 1.5 1 1.5 1 .9 1.5 2.3 1.1 2.9.8.1-.7.4-1.1.6-1.4-2.2-.3-4.6-1.1-4.6-5a3.9 3.9 0 0 1 1-2.7 3.6 3.6 0 0 1 .1-2.7s.9-.3 2.9 1a10 10 0 0 1 5.2 0c2-1.3 2.9-1 2.9-1a3.6 3.6 0 0 1 .1 2.7 3.9 3.9 0 0 1 1 2.7c0 3.9-2.4 4.7-4.6 5 .3.3.6 1 .6 2v2.9c0 .3.2.6.7.5A10 10 0 0 0 12 2Z"/></svg>
      </a>
      <a class="social" href="https://www.youtube.com/@DntHckMe" target="_blank" rel="noopener noreferrer" aria-label="YouTube">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M23.5 6.2a3 3 0 0 0-2.1-2.1C19.6 3.5 12 3.5 12 3.5s-7.6 0-9.4.6A3 3 0 0 0 .5 6.2 31.4 31.4 0 0 0 0 12a31.4 31.4 0 0 0 .5 5.8 3 3 0 0 0 2.1 2.1c1.8.6 9.4.6 9.4.6s7.6 0 9.4-.6a3 3 0 0 0 2.1-2.1A31.4 31.4 0 0 0 24 12a31.4 31.4 0 0 0-.5-5.8ZM9.75 15.5v-7l6 3.5-6 3.5Z"/></svg>
      </a>
    </div>
  </div>
</main>

<section class="window" aria-label="Projekty">
  <div class="titlebar"><i></i><i></i><i></i><span>projekty</span></div>
  <nav class="projects">
    <a class="project" href="/taryfikator">

    </a>
  </nav>
</section>

<footer>michaelfries.tech</footer>

<script>
(function(){
  /* Discord – kopiuje nick do schowka */
  var btn=document.getElementById('discord-btn');
  var tip=document.getElementById('discord-tip');
  btn.addEventListener('click',function(){
    var user=btn.dataset.user;
    function done(ok){
      tip.textContent=ok?'Skopiowano: '+user:user;
      tip.classList.add('show');
      setTimeout(function(){tip.classList.remove('show');},1800);
    }
    if(navigator.clipboard&&navigator.clipboard.writeText){
      navigator.clipboard.writeText(user).then(function(){done(true);},function(){done(false);});
    }else done(false);
  });


  var SUPABASE_URL="https://yrttmrpkfpsvneywsxtt.supabase.co";
  var SUPABASE_KEY="sb_publishable_eIkTHJV9M6Ou98tQI8R03g_DKul07sy";
  var viewEl=document.getElementById('view-count');
  var COUNTED_KEY="mf_counted_v2";
  function countedWithin24h(){
    try{var t=localStorage.getItem(COUNTED_KEY);return t&&(Date.now()-Number(t))<86400000;}
    catch(e){return false;}
  }
  function markCounted(){try{localStorage.setItem(COUNTED_KEY,Date.now());}catch(e){}}
  function fmt(n){return Number(n).toLocaleString('en-US')+' views';}

  async function updateViews(){
    try{
      var sb=window.supabase.createClient(SUPABASE_URL,SUPABASE_KEY);
      if(!countedWithin24h()){
        var bump=await sb.rpc('increment_views',{row_key:'profile-views'});
        if(bump.error)throw bump.error;
        markCounted();
        viewEl.textContent=fmt(bump.data);
        return;
      }
      var read=await sb.from('stats').select('value').eq('key','profile-views').single();
      if(read.error)throw read.error;
      viewEl.textContent=fmt(read.data.value);
    }catch(e){
      console.error('Błąd licznika wyświetleń:',e);
      viewEl.textContent='n/a';
    }
  }
  if(window.supabase)updateViews();
  else window.addEventListener('load',function(){window.supabase?updateViews():(viewEl.textContent='n/a');});
})();
</script>
</body>
</html>
