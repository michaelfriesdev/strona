<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>michael.fries</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;700;800&family=Space+Mono&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
:root{
  --bg:#050806;
  --panel:rgba(10,18,12,0.55);
  --line:#123320;
  --green:#39ff6a;
  --green-dim:#1c7a3c;
  --green-faint:#0d3b1f;
  --cyan:#3df2ff;
  --white:#f4fff6;
  --text-dim:#5a8a6b;
}
*{margin:0;padding:0;box-sizing:border-box;}
::selection{background:var(--green);color:#000;}
html,body{height:100%;}
body{
  background:var(--bg);
  color:var(--text-dim);
  font-family:'JetBrains Mono',monospace;
  overflow:hidden;
  display:flex;
  align-items:center;
  justify-content:center;
  position:relative;
}
#matrix-canvas{
  position:fixed;
  inset:0;
  z-index:0;
  opacity:0.18;
}
body::before{
  content:"";
  position:fixed;
  inset:0;
  background:repeating-linear-gradient(
    to bottom,
    rgba(57,255,106,0.035),
    rgba(57,255,106,0.035) 1px,
    transparent 1px,
    transparent 3px
  );
  pointer-events:none;
  z-index:2;
  mix-blend-mode:overlay;
}
body::after{
  content:"";
  position:fixed;
  inset:0;
  background:radial-gradient(ellipse at center, transparent 30%, rgba(0,0,0,0.65) 140%);
  pointer-events:none;
  z-index:3;
}
.card{
  position:relative;
  z-index:5;
  width:380px;
  max-width:90vw;
  background:var(--panel);
  backdrop-filter:blur(18px);
  border:1px solid var(--green-faint);
  border-radius:14px;
  padding:36px 30px 28px;
  box-shadow:
    0 0 0 1px rgba(0,0,0,0.3),
    0 25px 80px rgba(0,0,0,0.6),
    0 0 60px rgba(57,255,106,0.08);
  text-align:center;
  animation:rise .7s cubic-bezier(.2,.8,.2,1) both;
}
@keyframes rise{
  from{opacity:0;transform:translateY(24px) scale(.98);}
  to{opacity:1;transform:translateY(0) scale(1);}
}
.views{
  position:absolute;
  top:14px;
  right:16px;
  font-size:10.5px;
  color:var(--text-dim);
  letter-spacing:0.5px;
  display:flex;
  align-items:center;
  gap:5px;
}
.views .dot{
  width:6px;height:6px;
  border-radius:50%;
  background:var(--green);
  box-shadow:0 0 6px var(--green);
  animation:pulse 2s infinite;
}
@keyframes pulse{0%,100%{opacity:1;}50%{opacity:0.35;}}
.avatar-wrap{
  position:relative;
  width:96px;height:96px;
  margin:0 auto 18px;
}
.avatar-ring{
  position:absolute;
  inset:-6px;
  border-radius:50%;
  border:1px solid var(--green-dim);
  animation:spin 8s linear infinite;
}
@keyframes spin{to{transform:rotate(360deg);}}

.card-ring{
  position:absolute;
  inset:-1px;
  width:calc(100% + 2px);
  height:calc(100% + 2px);
  pointer-events:none;
  z-index:6;
  overflow:visible;
}
.card-ring rect{
  fill:none;
  stroke:var(--green);
  stroke-width:1;
  stroke-linecap:round;
  stroke-dasharray:16 384;
  filter:drop-shadow(0 0 6px rgba(57,255,106,0.5));
  animation:ring-move 3.6s linear infinite;
  color: linear-gradient(0deg, var(--green), var(--green-dim));
  vector-effect:non-scaling-stroke;
}
@keyframes ring-move{
  to{ stroke-dashoffset:-400; }
}
.avatar{
  width:96px;height:96px;
  border-radius:50%;
  background:linear-gradient(160deg,#0d1a10,#050806);
  border:1px solid var(--green-faint);
  display:flex;
  align-items:center;
  justify-content:center;
  font-size:34px;
  font-weight:800;
  color:var(--green);
  text-shadow:0 0 14px rgba(57,255,106,0.6);
  overflow:hidden;
}
.avatar img{
  width:100%;
  height:100%;
  object-fit:cover;
  filter:saturate(1.05) contrast(1.05);
}
.username{
  font-size:22px;
  font-weight:800;
  color:var(--white);
  letter-spacing:0.5px;
  position:relative;
  display:inline-block;
}
.username .cursor{
  display:inline-block;
  width:2px;
  height:18px;
  background:var(--green);
  margin-left:3px;
  vertical-align:middle;
  animation:blink 1s step-end infinite;
  box-shadow:0 0 6px var(--green);
}
@keyframes blink{50%{opacity:0;}}
.pronouns{
  font-size:11px;
  color:var(--text-dim);
  margin-top:4px;
  letter-spacing:1px;
  text-transform:uppercase;
}
.bio{
  margin-top:16px;
  font-size:12.5px;
  line-height:1.7;
  color:var(--text-dim);
  font-family:'Space Mono',monospace;
}
.bio .accent{color:var(--green);}
.tags{
  margin-top:16px;
  display:flex;
  justify-content:center;
  flex-wrap:wrap;
  gap:8px;
}
.tag{
  font-size:10px;
  letter-spacing:0.5px;
  padding:4px 10px;
  border:1px solid var(--green-faint);
  border-radius:20px;
  color:var(--cyan);
}
.socials{
  margin-top:24px;
  display:flex;
  justify-content:center;
  gap:14px;
}
.social{
  width:38px;height:38px;
  border-radius:9px;
  border:1px solid var(--green-faint);
  display:flex;
  align-items:center;
  justify-content:center;
  color:var(--text-dim);
  text-decoration:none;
  transition:all .2s;
  position:relative;
}
.social svg{width:16px;height:16px;fill:currentColor;}
.social:hover{
  color:var(--bg);
  background:var(--green);
  border-color:var(--green);
  box-shadow:0 0 18px rgba(57,255,106,0.5);
  transform:translateY(-3px);
}
.divider{
  margin:24px 0 16px;
  height:1px;
  background:linear-gradient(90deg,transparent,var(--green-faint),transparent);
}
.footer-line{
  font-size:10px;
  color:var(--text-dim);
  letter-spacing:0.5px;
}
.footer-line span{color:var(--green-dim);}
.audio-toggle{
  position:absolute;
  top:14px;left:16px;
  width:26px;height:26px;
  border-radius:6px;
  border:1px solid var(--green-faint);
  display:flex;
  align-items:center;
  justify-content:center;
  cursor:pointer;
  color:var(--text-dim);
  transition:all .2s;
}
.audio-toggle:hover{color:var(--green);border-color:var(--green-dim);}
.audio-toggle svg{width:12px;height:12px;fill:currentColor;}
@media (prefers-reduced-motion:reduce){
  *{animation:none !important;transition:none !important;}
}
a:focus-visible, .audio-toggle:focus-visible{
  outline:2px solid var(--cyan);
  outline-offset:2px;
}
</style>
</head>
<body>
<canvas id="matrix-canvas"></canvas>

<div class="card">
  <svg class="card-ring" aria-hidden="true">
    <rect x="1" y="1" width="calc(100% - 2px)" height="calc(100% - 2px)" rx="15" ry="15" pathLength="400"></rect>
  </svg>
  <div class="views"><span class="dot"></span><span id="view-count">···</span> views</div>

  <div class="avatar-wrap">
    <div class="avatar-ring"></div>
    <div class="avatar"><img src="https://i.pinimg.com/564x/37/17/d6/3717d6a414d8dc80186aa48cbd089804.jpg" alt="michael.fries avatar"></div>
  </div>

  <div class="username">Michael Fries<span class="cursor"></span></div>
  <div class="pronouns">CERTIFIED LARP</div>

  <div class="bio">
    <span class="accent">&gt;</span> software engineer<br>
    Discord bots, C++ apps and anything about computers.
  </div>

  <div class="tags">
    <span class="tag">Python</span>
    <span class="tag">C++</span>
    <span class="tag">JavaScript</span>
  </div>

  <div class="socials">
    <a class="social" href="#" aria-label="Discord">
      <svg viewBox="0 0 24 24"><path d="M20.3 4.4A19.8 19.8 0 0 0 15.6 3l-.3.6a14.2 14.2 0 0 1 4 1.6 15.3 15.3 0 0 0-13.6 0A14.2 14.2 0 0 1 9.7 3l-.3-.6a19.8 19.8 0 0 0-4.7 1.5C1.7 8.5 1 12.5 1.3 16.4a19.9 19.9 0 0 0 6 3l1-1.6a13 13 0 0 1-1.9-.9l.5-.4a14.3 14.3 0 0 0 12.2 0l.5.4a13 13 0 0 1-1.9.9l1 1.6a19.9 19.9 0 0 0 6-3c.4-4.5-.7-8.5-3-12ZM8.9 14.3c-.9 0-1.6-.8-1.6-1.8s.7-1.8 1.6-1.8 1.6.8 1.6 1.8-.7 1.8-1.6 1.8Zm6.2 0c-.9 0-1.6-.8-1.6-1.8s.7-1.8 1.6-1.8 1.6.8 1.6 1.8-.7 1.8-1.6 1.8Z"/></svg>
    </a>
    <a class="social" href="https://github.com/michaelfriesdev/" aria-label="GitHub">
      <svg viewBox="0 0 24 24"><path d="M12 2a10 10 0 0 0-3.2 19.5c.5.1.7-.2.7-.5v-1.7c-2.8.6-3.4-1.3-3.4-1.3-.4-1.2-1-1.5-1-1.5-.9-.6.1-.6.1-.6 1 .1 1.5 1 1.5 1 .9 1.5 2.3 1.1 2.9.8.1-.7.4-1.1.6-1.4-2.2-.3-4.6-1.1-4.6-5a3.9 3.9 0 0 1 1-2.7 3.6 3.6 0 0 1 .1-2.7s.9-.3 2.9 1a10 10 0 0 1 5.2 0c2-1.3 2.9-1 2.9-1a3.6 3.6 0 0 1 .1 2.7 3.9 3.9 0 0 1 1 2.7c0 3.9-2.4 4.7-4.6 5 .3.3.6 1 .6 2v2.9c0 .3.2.6.7.5A10 10 0 0 0 12 2Z"/></svg>
    </a>
    <a class="social" href="https://www.youtube.com/@DntHckMe" aria-label="Youtube">
      <svg viewBox="0 0 24 24"><path d="M23.5 6.2a3 3 0 0 0-2.1-2.1C19.6 3.5 12 3.5 12 3.5s-7.6 0-9.4.6A3 3 0 0 0 .5 6.2 31.4 31.4 0 0 0 0 12a31.4 31.4 0 0 0 .5 5.8 3 3 0 0 0 2.1 2.1c1.8.6 9.4.6 9.4.6s7.6 0 9.4-.6a3 3 0 0 0 2.1-2.1A31.4 31.4 0 0 0 24 12a31.4 31.4 0 0 0-.5-5.8ZM9.75 15.5v-7l6 3.5-6 3.5Z"/></svg>
    </a>
  </div>

  <div class="divider"></div>
  <div class="footer-line"><span>[</span> michaelfries.tech <span>]</span></div>
</div>

<script>
(function(){
  var canvas=document.getElementById('matrix-canvas');
  var ctx=canvas.getContext('2d');
  var w,h,cols,drops;
  var chars='アイウエオカキクケコサシスセソ0123456789ABCDEFGHIJKLMNOPQRSTUVWXYZ';
  function resize(){
    w=canvas.width=window.innerWidth;
    h=canvas.height=window.innerHeight;
    cols=Math.floor(w/16);
    drops=new Array(cols).fill(0).map(function(){return Math.random()*-50;});
  }
  window.addEventListener('resize',resize);
  resize();
  function draw(){
    ctx.fillStyle='rgba(5,8,6,0.08)';
    ctx.fillRect(0,0,w,h);
    ctx.fillStyle='#39ff6a';
    ctx.font='14px monospace';
    for(var i=0;i<cols;i++){
      var text=chars.charAt(Math.floor(Math.random()*chars.length));
      ctx.fillText(text,i*16,drops[i]*16);
      if(drops[i]*16>h && Math.random()>0.975){
        drops[i]=0;
      }
      drops[i]++;
    }
    requestAnimationFrame(draw);
  }
  draw();


  var SUPABASE_URL = "https://yrttmrpkfpsvneywsxtt.supabase.co";
  var SUPABASE_KEY = "sb_publishable_eIkTHJV9M6Ou98tQI8R03g_DKul07sy";
  var viewEl=document.getElementById('view-count');
  var COUNTED_KEY="mf_counted_v2";

  function countedWithin24h(){
    try{
      var t=localStorage.getItem(COUNTED_KEY);
      return t && (Date.now()-Number(t))<86400000;
    }catch(e){ return false; }
  }
  function markCounted(){
    try{ localStorage.setItem(COUNTED_KEY, Date.now()); }catch(e){}
  }

  async function updateViews(){
    viewEl.textContent='···';

    if(!SUPABASE_URL || !SUPABASE_KEY){
      viewEl.textContent='n/a';
      console.warn('Uzupełnij SUPABASE_URL i SUPABASE_KEY, żeby licznik działał.');
      return;
    }
    try{
      var supabase=window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

      if(!countedWithin24h()){
        var bump=await supabase.rpc('increment_views', { row_key: 'profile-views' });
        if(bump.error) throw bump.error;
        markCounted();
        viewEl.textContent=Number(bump.data).toLocaleString("en-US");
        return;
      }

      var read=await supabase.from("stats").select("value").eq("key","profile-views").single();
      if(read.error) throw read.error;
      viewEl.textContent=Number(read.data.value).toLocaleString("en-US");
    }catch(e){
      console.error('Blad licznika wyswietlen:', e);
      viewEl.textContent='n/a';
    }
  }
  updateViews();


  var toggle=document.getElementById('audio-toggle');
  var muted=true;
  function flip(){
    muted=!muted;
    toggle.innerHTML=muted
      ? '<svg viewBox="0 0 24 24"><path d="M3 9v6h4l5 5V4L7 9H3z"/></svg>'
      : '<svg viewBox="0 0 24 24"><path d="M3 9v6h4l5 5V4L7 9H3zm13.5 3a4.5 4.5 0 0 0-2.5-4v8a4.5 4.5 0 0 0 2.5-4z"/></svg>';
  }
  toggle.addEventListener('click',flip);
  toggle.addEventListener('keydown',function(e){
    if(e.key==='Enter'||e.key===' '){e.preventDefault();flip();}
  });
})();
</script>
</body>
</html>
