<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Best Sens Calculator Pro</title>
<style>
body{font-family:Arial,sans-serif;background:#0f172a;color:#fff;display:flex;justify-content:center;align-items:center;min-height:100vh;margin:0}
.card{background:#1e293b;padding:30px;border-radius:20px;box-shadow:0 10px 30px rgba(0,0,0,.3);width:380px}
h1{text-align:center;margin-top:0}.row{margin:12px 0}label{display:block;margin-bottom:6px}input,select,button{width:100%;padding:10px;border:none;border-radius:10px;font-size:16px}input,select{background:#334155;color:#fff}button{background:#22c55e;color:#fff;font-weight:bold;cursor:pointer;margin-top:10px}button:hover{background:#16a34a}.result{margin-top:18px;padding:15px;background:#0f172a;border-radius:12px;line-height:1.6}
small{color:#94a3b8}
</style>
</head>
<body>
<div class="card">
<h1>FPS Sens Calculator</h1>
<div class="row"><label>Game</label><select id="game"><option>CS2</option><option>Valorant</option></select></div>
<div class="row"><label>DPI</label><input id="dpi" type="number" value="800"></div>
<div class="row"><label>Mousepad Width (cm)</label><input id="pad" type="number" value="45"></div>
<div class="row"><label>Playstyle</label><select id="style"><option value="0.9">Precision / Rifler</option><option value="1">Balanced</option><option value="1.15">Fast / Entry</option></select></div>
<button onclick="calc()">Calculate Best Sens</button>
<div class="result" id="out">Enter values and calculate.</div>
<button onclick="startTracking()">REAL Tracking Mode</button><div class="result" id="ai">AI coach waiting...</div><small>Based on common pro ranges (30-45 cm/360).</small>
<div class="row"><label>Mouse Weight (grams)</label><input id="weight" type="number" value="65"></div>
<div class="row"><label>Mousepad Height (cm)</label><input id="padh" type="number" value="40"></div>
<button onclick="reactionTest()">Aim Trainer Test Mode</button>
<div class="result" id="trainer">Click test to measure reaction speed.</div>
</div>
<script>
let startTime=0; let hits=0; let misses=0; let round=0;
function reactionTest(){
 const box=document.getElementById('trainer');
 box.innerHTML='Wait for green...';
 box.style.background='#7f1d1d';
 setTimeout(()=>{
   startTime=Date.now();
   box.innerHTML='CLICK NOW!';
   box.style.background='#166534';
   box.onclick=function(){
      let ms=Date.now()-startTime;
      let score=Math.max(1,300-ms);
      box.innerHTML='Reaction: '+ms+' ms<br>Score: '+score+'/300';
      box.onclick=null;
   }
 },Math.random()*3000+1000);
}
function startTracking(){hits=0;misses=0;round=0;spawnTarget();}
function spawnTarget(){if(round>=10){aiCoach();return;} round++; let t=document.createElement('div'); t.className='target'; t.style.cssText='width:40px;height:40px;border-radius:50%;background:#22c55e;position:absolute;cursor:pointer;box-shadow:0 0 20px #22c55e;left:'+Math.random()*(window.innerWidth-60)+'px;top:'+Math.random()*(window.innerHeight-60)+'px'; document.body.appendChild(t); t.onclick=function(){hits++; t.remove(); setTimeout(spawnTarget,250)}; setTimeout(()=>{if(document.body.contains(t)){misses++; t.remove(); spawnTarget();}},1200);} 
function aiCoach(){let acc=(hits/(hits+misses))*100; let msg=acc>85?'High precision → lower sens slightly':acc>65?'Balanced → keep current sens':'Need faster turns → raise sens'; document.getElementById('ai').innerHTML='Hits: '+hits+' Misses: '+misses+' Accuracy: '+acc.toFixed(0)+'%<br>'+msg;}
function calc(){
 let game=document.getElementById('game').value;
 let dpi=parseFloat(document.getElementById('dpi').value)||800;
 let pad=parseFloat(document.getElementById('pad').value)||45;
 let padh=parseFloat(document.getElementById('padh').value)||40;
 let weight=parseFloat(document.getElementById('weight').value)||65;
 let style=parseFloat(document.getElementById('style').value);
 let target360=Math.max(30, Math.min(45, pad*0.8))*style;
 let base=360/(dpi*target360);
 let sens=game==='CS2'?base*100:base*31.4;
 if(game==='Valorant') sens=sens/3.1818;
 let area=pad*padh;
 let control=(area/(weight)).toFixed(2);
 document.getElementById('out').innerHTML=
 '<b>'+game+' Recommended Sens:</b> '+sens.toFixed(2)+ '<br><b>eDPI:</b> '+(sens*dpi).toFixed(0)+ '<br><b>cm/360:</b> '+target360.toFixed(1)+ '<br><b>Pad Area:</b> '+area+' cm²<br><b>Mouse Control Ratio:</b> '+control+'<br><b>Pro Compare:</b> s1mple ~3.09@400 | ZywOo ~2.0@400 | TenZ 0.408@800 VAL';
}
</script>
</body>
</html>
